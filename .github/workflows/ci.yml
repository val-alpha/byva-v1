name: Rust CI

on:
  push:
    branches: [main, "byva/**"]
  pull_request:
    branches: [main, "byva/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt and export canonical source
        shell: bash
        run: |
          cargo fmt --all
          for file in crates/tokenizer/src/lib.rs crates/tokenizer/tests/golden.rs crates/format/src/lib.rs crates/format/src/untrusted.rs crates/format/tests/golden.rs; do
            echo "RUSTFMT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "RUSTFMT_END:$file"
          done
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Export generated lockfile
        shell: bash
        run: |
          echo "CARGO_LOCK_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "CARGO_LOCK_END"
      - name: Check fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
