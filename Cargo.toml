[workspace]
resolver = "3"
members = ["crates/tokenizer", "crates/format", "crates/model", "crates/runtime", "crates/convert", "crates/tensor", "crates/autodiff", "crates/data", "crates/trainer", "crates/cli"]
default-members = ["crates/cli"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/val-alpha/byva-v1"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
